name: CI

env:
  API_BASE_URL: "http://localhost:3000/api"
  MSW_ENABLED: "true"

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint-format-build:
    runs-on: ubuntu-latest

    steps:
      # 1. コード取得
      - uses: actions/checkout@v4

      # 2. Node.js のセットアップ
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. 依存インストール（frontend ディレクトリ内で）
      - run: npm ci
        working-directory: ./app

      # 4. ESLint 実行
      - run: npm run lint
        working-directory: ./app

      # 5. Prettier チェック
      - run: npm run format:check
        working-directory: ./app

      # 6. Next.js ビルド
      - run: npm run build
        working-directory: ./app
