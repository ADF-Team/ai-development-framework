services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: adf
      POSTGRES_PASSWORD: adf
      POSTGRES_DB: adf_dev
    ports:
      # ホストの5432番は別のネイティブPostgreSQLと衝突する環境があるため5433を使う
      - '5433:5432'
    volumes:
      - adf_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U adf -d adf_dev']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  adf_postgres_data:
